[package]
categories = [
    "cryptography::cryptocurrencies",
]
description = """
WIP
"""
keywords = [
    "zcash",
    "tachyon",
]
name = "zcash_tachyon"
version = "0.0.0"

publish = false

documentation = "https://docs.rs/zcash_tachyon"
readme = "README.md"
repository = "https://github.com/tachyon-zcash/tachyon"

edition.workspace = true
license.workspace = true
rust-version.workspace = true

[package.metadata.docs.rs]
rustdoc-args = [
    "--document-private-items",
    "--html-in-header",
    "katex-header.html",
]

[features]
default = [
    "std",
]
std = [
    "blake2b_simd/std",
    "corez/std",
    "derive_more/std",
    "ff/std",
    "ragu/multicore",
    "ragu/std",
    "ragu_circuits/multicore",
    "ragu_circuits/std",
    "ragu_core/std",
    "ragu_pcd/std",
    "ragu_primitives/std",
    "reddsa/std",
]
test-epoch-size = [
]

[lints]
workspace = true

[dependencies]
blake2b_simd = { version = "1.0", default-features = false }
corez = { version = "0.1.1", default-features = false, features = [
    "alloc",
] }
derive_more = { version = "~2.1", default-features = false, features = [
    "full", # todo: use more specific features
] }
ff = { version = "0.14", default-features = false }
group = { version = "0.14", default-features = false }
# `spin_no_std` swaps `std::sync::Once` for a spin lock, which is what lets
# this crate and `ragu_pcd`'s baked parameters reach a bare-metal target.
lazy_static = { version = "1.5.0", default-features = false, features = [
    "spin_no_std",
] }
pasta_curves = { package = "zakura-pasta-curves", version = "1.0.1", features = [
    "deferred",
] }
# TEMPORARY: c/mock-wire+driver on the cnode-agent fork combines ragu main
# with #929 (driver-backed mock) and the mock wire serialization (follow-up
# to #875). Switch back to tachyon-zcash/ragu once both land upstream.
ragu = { git = "https://github.com/cnode-agent/ragu", branch = "c/mock-wire+driver", default-features = false, features = [
    "mock",
] }
ragu_circuits = { git = "https://github.com/cnode-agent/ragu", branch = "c/mock-wire+driver", package = "ragu_circuits", default-features = false, features = [
    "alloc",
] }
ragu_core = { git = "https://github.com/cnode-agent/ragu", branch = "c/mock-wire+driver", package = "ragu_core", default-features = false, features = [
    "alloc",
] }
ragu_pcd = { git = "https://github.com/cnode-agent/ragu", branch = "c/mock-wire+driver", package = "ragu_pcd", default-features = false, features = [
    "baked",
] }
ragu_primitives = { git = "https://github.com/cnode-agent/ragu", branch = "c/mock-wire+driver", package = "ragu_primitives", default-features = false, features = [
    "alloc",
] }
rand_core = { version = "0.10", default-features = false }
reddsa = { version = "1.0.1", package = "zakura-reddsa", default-features = false }
udon = { package = "zakura-udon", version = "0.1.0", default-features = false, features = [
    "traits",
    "poseidon",
] }

[dev-dependencies]
ragu_arithmetic = { git = "https://github.com/tachyon-zcash/ragu", rev = "0881656dc3d9f47d3d9eaaf692b15dd8938d9bf9", default-features = false, features = [
    "alloc",
    "multicore",
] }
ragu_pasta = { git = "https://github.com/tachyon-zcash/ragu", rev = "0881656dc3d9f47d3d9eaaf692b15dd8938d9bf9", default-features = false, features = [
    "alloc",
    "baked",
] }
rand = { version = "0.10", default-features = false, features = [
    "std_rng",
] }

[lib]
bench = false
